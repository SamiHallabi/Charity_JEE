# Production Profile - Used on Railway
spring.application.name=charity

# MySQL DataSource - Railway provides DATABASE_URL
spring.datasource.url=${DATABASE_URL}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver
spring.jpa.hibernate.ddl-auto=validate

# JPA / Hibernate
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=false

# Server
server.port=${PORT:8080}
server.servlet.context-path=/

# File Upload
spring.servlet.multipart.enabled=true
spring.servlet.multipart.max-file-size=100000MB
spring.servlet.multipart.max-request-size=200000MB
app.upload.dir=/tmp/uploads

# Mail (Gmail SMTP)
spring.mail.host=smtp.gmail.com
spring.mail.port=587
spring.mail.username=${MAIL_USERNAME}
spring.mail.password=${MAIL_PASSWORD}
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true

# Google OAuth2
spring.security.oauth2.client.registration.google.client-id=${GOOGLE_CLIENT_ID}
spring.security.oauth2.client.registration.google.client-secret=${GOOGLE_CLIENT_SECRET}
spring.security.oauth2.client.registration.google.scope=openid,profile,email

# Stripe
stripe.api.key=${STRIPE_SECRET_KEY}
app.base-url=${APP_BASE_URL:https://charity-app.railway.app}

# JPA extras
spring.jpa.open-in-view=false

# Logging
logging.level.org.springframework.security.config.annotation.authentication.configuration.InitializeUserDetailsBeanManagerConfigurer=ERROR
logging.level.org.hibernate.orm.core=ERROR
logging.level.root=INFO

# Thymeleaf
spring.thymeleaf.cache=true

