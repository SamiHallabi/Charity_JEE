<!DOCTYPE html>
<html lang="fr" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{layout :: head('Historique des dons')}"></head>
<body>
<nav th:replace="~{layout :: navbar}"></nav>

<div class="container py-5">
    <div class="d-flex justify-content-between align-items-center mb-4">
        <h2 class="fw-bold">Mes dons</h2>
        <a th:href="@{/user/profile}" class="btn btn-outline-secondary btn-sm">
            <i class="bi bi-arrow-left me-1"></i>Retour
        </a>
    </div>

    <div th:if="${donations == null or donations.isEmpty()}"
         class="text-center text-muted py-5">
        <i class="bi bi-heart display-4"></i>
        <p class="mt-3">Vous n'avez pas encore effectué de don.</p>
        <a th:href="@{/explore}" class="btn btn-success">Découvrir des actions</a>
    </div>

    <div class="card shadow" th:unless="${donations == null or donations.isEmpty()}">
        <div class="table-responsive">
            <table class="table table-hover mb-0">
                <thead class="table-success">
                    <tr>
                        <th>Action</th>
                        <th>Montant</th>
                        <th>Statut</th>
                        <th>Référence</th>
                        <th>Date</th>
                    </tr>
                </thead>
                <tbody>
                    <tr th:each="don : ${donations}">
                        <td>
                            <a th:href="@{/actions/{id}(id=${don.charityActionId})}"
                               class="text-decoration-none fw-semibold"
                               th:text="${don.charityActionTitle}">Action</a>
                        </td>
                        <td class="fw-bold text-success"
                            th:text="${don.amount} + ' MAD'">0 MAD</td>
                        <td>
                            <span class="badge"
                                  th:classappend="${don.status.name() == 'COMPLETED'} ? 'bg-success' : 'bg-warning'"
                                  th:text="${don.status}">STATUS</span>
                        </td>
                        <td><code th:text="${don.transactionId}">TXN</code></td>
                        <td th:text="${#temporals.format(don.donationDate, 'dd/MM/yyyy HH:mm')}">date</td>
                    </tr>
                </tbody>
            </table>
        </div>
    </div>
</div>

<footer th:replace="~{layout :: footer}"></footer>
</body>
</html>
