<!DOCTYPE html>
<html lang="fr" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{layout :: head('Mes participations')}"></head>
<body>
<nav th:replace="~{layout :: navbar}"></nav>

<div class="container py-5">
    <div class="d-flex justify-content-between align-items-center mb-4">
        <h2 class="fw-bold">Mes participations</h2>
        <a th:href="@{/user/profile}" class="btn btn-outline-secondary btn-sm">
            <i class="bi bi-arrow-left me-1"></i>Retour
        </a>
    </div>

    <div th:if="${participations == null or participations.isEmpty()}"
         class="text-center text-muted py-5">
        <i class="bi bi-people display-4"></i>
        <p class="mt-3">Vous ne participez à aucune action pour le moment.</p>
        <a th:href="@{/explore}" class="btn btn-success">Explorer les actions</a>
    </div>

    <div class="row g-4" th:unless="${participations == null or participations.isEmpty()}">
        <div class="col-md-4" th:each="p : ${participations}">
            <div class="card shadow-sm">
                <div class="card-body">
                    <h6 class="fw-semibold" th:text="${p.charityActionTitle}">Action</h6>
                    <small class="text-muted">
                        Inscrit le
                        <span th:text="${#temporals.format(p.registeredAt, 'dd/MM/yyyy')}">date</span>
                    </small>
                </div>
                <div class="card-footer bg-transparent">
                    <a th:href="@{/actions/{id}(id=${p.charityActionId})}"
                       class="btn btn-outline-success btn-sm w-100">Voir l'action</a>
                </div>
            </div>
        </div>
    </div>
</div>

<footer th:replace="~{layout :: footer}"></footer>
</body>
</html>
