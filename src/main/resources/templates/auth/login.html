<!DOCTYPE html>
<html lang="fr" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{layout :: head('Connexion')}"></head>
<body class="bg-light">
<nav th:replace="~{layout :: navbar}"></nav>

<div class="container py-5">
    <div class="row justify-content-center">
        <div class="col-md-5">
            <div class="card shadow">
                <div class="card-body p-5">
                    <h3 class="card-title text-center fw-bold mb-4">
                        <i class="bi bi-heart-fill text-success me-2"></i>Connexion
                    </h3>

                    <div th:if="${param.error}" class="alert alert-danger">
                        Email ou mot de passe incorrect.
                    </div>
                    <div th:if="${param.logout}" class="alert alert-info">
                        Vous avez été déconnecté.
                    </div>
                    <div th:if="${param.registered}" class="alert alert-success">
                        Compte créé ! Connectez-vous maintenant.
                    </div>
                    <div th:if="${param['org-registered']}" class="alert alert-success">
                        Organisation enregistrée. En attente de validation par un administrateur.
                    </div>

                    <form th:action="@{/auth/login}" method="post">
                        <div class="mb-3">
                            <label class="form-label fw-semibold">Email</label>
                            <input type="email" name="username" class="form-control"
                                   placeholder="email@exemple.com" required/>
                        </div>
                        <div class="mb-4">
                            <label class="form-label fw-semibold">Mot de passe</label>
                            <input type="password" name="password" class="form-control"
                                   placeholder="••••••••" required/>
                        </div>
                        <button type="submit" class="btn btn-success w-100 mb-3">
                            <i class="bi bi-box-arrow-in-right me-2"></i>Se connecter
                        </button>
                    </form>

                    <hr/>
                    <a th:href="@{/oauth2/authorization/google}"
                       class="btn btn-outline-danger w-100 mb-3">
                        <i class="bi bi-google me-2"></i>Connexion avec Google
                    </a>

                    <div class="text-center mt-3">
                        <small>Pas encore de compte ?
                            <a th:href="@{/auth/register}">S'inscrire</a>
                        </small>
                    </div>
                    <div class="text-center">
                        <small>Organisation ?
                            <a th:href="@{/auth/register-org}">Enregistrer mon organisation</a>
                        </small>
                    </div>
                </div>
            </div>
        </div>
    </div>
</div>

<footer th:replace="~{layout :: footer}"></footer>
</body>
</html>
