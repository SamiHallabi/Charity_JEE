<!DOCTYPE html>
<html lang="fr" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{layout :: head('Admin — Tableau de bord')}"></head>
<body>
<nav th:replace="~{layout :: navbar}"></nav>

<div class="container py-5">
    <div th:if="${param.deleted}" class="alert alert-success">Utilisateur supprimé.</div>

    <h2 class="fw-bold mb-4">
        <i class="bi bi-shield-fill text-success me-2"></i>Tableau de bord super-admin
    </h2>

    <!-- Stats -->
    <div class="row g-4 mb-5">
        <div class="col-md-4">
            <div class="card shadow stat-card p-4 text-center">
                <h3 class="fw-bold text-warning"
                    th:text="${pendingOrgs != null ? pendingOrgs.size() : 0}">0</h3>
                <p class="mb-0 text-muted">Organisations en attente</p>
                <a th:href="@{/admin/organizations}" class="btn btn-warning btn-sm mt-2">Valider</a>
            </div>
        </div>
        <div class="col-md-4">
            <div class="card shadow stat-card p-4 text-center">
                <h3 class="fw-bold text-success"
                    th:text="${allOrgs != null ? allOrgs.size() : 0}">0</h3>
                <p class="mb-0 text-muted">Organisations totales</p>
            </div>
        </div>
        <div class="col-md-4">
            <div class="card shadow stat-card p-4 text-center">
                <h3 class="fw-bold text-primary"
                    th:text="${allUsers != null ? allUsers.size() : 0}">0</h3>
                <p class="mb-0 text-muted">Utilisateurs inscrits</p>
            </div>
        </div>
    </div>

    <!-- Users table -->
    <div class="card shadow">
        <div class="card-header bg-primary text-white fw-semibold">
            <i class="bi bi-people me-2"></i>Gestion des utilisateurs
        </div>
        <div class="table-responsive">
            <table class="table table-hover mb-0">
                <thead class="table-light">
                    <tr>
                        <th>ID</th>
                        <th>Nom</th>
                        <th>Email</th>
                        <th>Rôle</th>
                        <th>Inscription</th>
                        <th>Action</th>
                    </tr>
                </thead>
                <tbody>
                    <tr th:each="u : ${allUsers}">
                        <td th:text="${u.id}">1</td>
                        <td th:text="${u.firstName + ' ' + u.lastName}">Nom</td>
                        <td th:text="${u.email}">email</td>
                        <td><span class="badge bg-success" th:text="${u.role}">USER</span></td>
                        <td th:text="${u.createdAt != null ? #temporals.format(u.createdAt, 'dd/MM/yyyy') : '-'}">date</td>
                        <td>
                            <form th:action="@{/admin/users/{id}/delete(id=${u.id})}"
                                  method="post" class="d-inline"
                                  onsubmit="return confirm('Supprimer cet utilisateur ?')">
                                <button type="submit" class="btn btn-outline-danger btn-sm">
                                    <i class="bi bi-trash"></i>
                                </button>
                            </form>
                        </td>
                    </tr>
                    <tr th:if="${allUsers == null or allUsers.isEmpty()}">
                        <td colspan="6" class="text-center text-muted py-3">Aucun utilisateur.</td>
                    </tr>
                </tbody>
            </table>
        </div>
    </div>
</div>

<footer th:replace="~{layout :: footer}"></footer>
</body>
</html>
