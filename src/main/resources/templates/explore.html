<!DOCTYPE html>
<html lang="fr" xmlns:th="http://www.thymeleaf.org"
      xmlns:sec="http://www.thymeleaf.org/extras/spring-security">
<head th:replace="~{layout :: head('Explorer les actions')}"></head>
<body>
<nav th:replace="~{layout :: navbar}"></nav>

<div class="container py-5">
    <h2 class="fw-bold mb-4">Explorer les actions</h2>

    <!-- Search form -->
    <form th:action="@{/explore}" method="get" class="card p-4 shadow-sm mb-5">
        <div class="row g-3 align-items-end">
            <div class="col-md-5">
                <label class="form-label fw-semibold">Rechercher</label>
                <input type="text" name="keyword" class="form-control"
                       placeholder="Titre, description…"
                       th:value="${keyword}"/>
            </div>
            <div class="col-md-4">
                <label class="form-label fw-semibold">Catégorie</label>
                <select name="category" class="form-select">
                    <option value="">— Toutes les catégories —</option>
                    <option th:each="cat : ${categories}" th:value="${cat}"
                            th:text="${cat}"
                            th:selected="${cat == selectedCategory}">CAT</option>
                </select>
            </div>
            <div class="col-md-3">
                <button type="submit" class="btn btn-success w-100">
                    <i class="bi bi-search me-1"></i>Rechercher
                </button>
            </div>
        </div>
    </form>

    <!-- Results -->
    <div th:if="${actions == null or actions.isEmpty()}" class="text-center text-muted py-5">
        <i class="bi bi-search display-4"></i>
        <p class="mt-3">Aucune action trouvée.</p>
    </div>

    <div class="row g-4">
        <div class="col-md-4" th:each="action : ${actions}">
            <div class="card action-card h-100 shadow-sm">
                <div class="card-body d-flex flex-column">
                    <div class="mb-2">
                        <span class="badge bg-success badge-category"
                              th:text="${action.category}">CAT</span>
                        <span class="badge bg-secondary ms-1"
                              th:text="${action.status}">STATUS</span>
                    </div>
                    <h5 class="card-title" th:text="${action.title}">Titre</h5>
                    <p class="card-text text-muted flex-grow-1"
                       th:text="${#strings.abbreviate(action.description, 120)}">Description</p>
                    <small class="text-muted">
                        <i class="bi bi-building me-1"></i>
                        <span th:text="${action.organizationName}">Org</span>
                    </small>
                    <div class="mt-3">
                        <div class="progress">
                            <div class="progress-bar bg-success"
                                 th:style="'width:' + ${action.progressPercent} + '%'"
                                 role="progressbar"></div>
                        </div>
                        <small class="text-muted">
                            <span th:text="${action.amountCollected}">0</span> /
                            <span th:text="${action.fundraisingGoal}">0</span> MAD
                        </small>
                    </div>
                </div>
                <div class="card-footer bg-transparent">
                    <a th:href="@{/actions/{id}(id=${action.id})}"
                       class="btn btn-outline-success btn-sm w-100">Voir détails</a>
                </div>
            </div>
        </div>
    </div>
</div>

<footer th:replace="~{layout :: footer}"></footer>
</body>
</html>
