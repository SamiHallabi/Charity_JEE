<!DOCTYPE html>
<html lang="fr" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{layout :: head('Mes actions')}"></head>
<body>
<nav th:replace="~{layout :: navbar}"></nav>

<div class="container py-5">
    <div th:if="${param.created}" class="alert alert-success">Action créée avec succès.</div>
    <div th:if="${param.updated}" class="alert alert-success">Action mise à jour.</div>
    <div th:if="${param.archived}" class="alert alert-info">Action archivée.</div>

    <div class="d-flex justify-content-between align-items-center mb-4">
        <h2 class="fw-bold">Mes actions caritatives</h2>
        <a th:href="@{/org/actions/create}" class="btn btn-success">
            <i class="bi bi-plus-circle me-2"></i>Nouvelle action
        </a>
    </div>

    <div th:if="${actions == null or actions.isEmpty()}" class="text-center text-muted py-5">
        <i class="bi bi-inbox display-4"></i>
        <p class="mt-3">Aucune action créée pour le moment.</p>
    </div>

    <div class="row g-4" th:unless="${actions == null or actions.isEmpty()}">
        <div class="col-md-6" th:each="action : ${actions}">
            <div class="card shadow-sm">
                <div class="card-body">
                    <div class="d-flex justify-content-between mb-2">
                        <span class="badge bg-success" th:text="${action.category}">CAT</span>
                        <span class="badge"
                              th:classappend="${action.status.name() == 'ACTIVE'} ? 'bg-success' : 'bg-secondary'"
                              th:text="${action.status}">STATUS</span>
                    </div>
                    <h5 class="fw-semibold" th:text="${action.title}">Titre</h5>
                    <p class="text-muted small"
                       th:text="${#strings.abbreviate(action.description, 80)}">Description</p>
                    <div class="progress mb-2">
                        <div class="progress-bar bg-success"
                             th:style="'width:' + ${action.progressPercent} + '%'"
                             role="progressbar"></div>
                    </div>
                    <small class="text-muted">
                        <span th:text="${action.amountCollected}">0</span> /
                        <span th:text="${action.fundraisingGoal}">0</span> MAD
                    </small>
                </div>
                <div class="card-footer bg-transparent d-flex gap-2">
                    <a th:href="@{/actions/{id}(id=${action.id})}"
                       class="btn btn-outline-success btn-sm">Voir</a>
                    <a th:href="@{/org/actions/{id}/edit(id=${action.id})}"
                       class="btn btn-outline-primary btn-sm">Modifier</a>
                    <form th:action="@{/org/actions/{id}/archive(id=${action.id})}"
                          method="post" class="d-inline"
                          th:if="${action.status.name() == 'ACTIVE'}">
                        <button type="submit" class="btn btn-outline-secondary btn-sm"
                                onclick="return confirm('Archiver cette action ?')">Archiver</button>
                    </form>
                </div>
            </div>
        </div>
    </div>
</div>

<footer th:replace="~{layout :: footer}"></footer>
</body>
</html>
