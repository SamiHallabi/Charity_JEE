spring.application.name=charity

# ── MySQL DataSource ──────────────────────────────────────────────────
spring.datasource.url=jdbc:mysql://localhost:3306/charity_db_jee?useSSL=false&serverTimezone=UTC
spring.datasource.username=root
spring.datasource.password=
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# ── JPA / Hibernate ───────────────────────────────────────────────────
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

# ── MongoDB (disabled — remove the @SpringBootApplication exclude list in CharityApplication.java to enable) ──
# spring.data.mongodb.uri=mongodb://localhost:27017/charity_mongo

# ── File Upload ───────────────────────────────────────────────────────
spring.servlet.multipart.enabled=true
spring.servlet.multipart.max-file-size=1000MB
spring.servlet.multipart.max-request-size=2000MB
app.upload.dir=uploads

# ── Mail (Gmail SMTP — replace with real credentials) ─────────────────
spring.mail.host=smtp.gmail.com
spring.mail.port=587
spring.mail.username=${MAIL_USERNAME}
spring.mail.password=${MAIL_PASSWORD:your-email-password}
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true


# ── Google OAuth2 (replace with real credentials) ─────────────────────
spring.security.oauth2.client.registration.google.client-id=${GOOGLE_CLIENT_ID:your-client-id}
spring.security.oauth2.client.registration.google.client-secret=${GOOGLE_CLIENT_SECRET:your-client-secret}
spring.security.oauth2.client.registration.google.scope=openid,profile,email

# ── Stripe ────────────────────────────────────────────────────────────
stripe.api.key=${STRIPE_SECRET_KEY}
app.base-url=http://localhost:8080

# ── JPA extras ────────────────────────────────────────────────────────
spring.jpa.open-in-view=false

# ── Logging ───────────────────────────────────────────────────────────
logging.level.org.springframework.security.config.annotation.authentication.configuration.InitializeUserDetailsBeanManagerConfigurer=ERROR
logging.level.org.hibernate.orm.core=ERROR

# ── Thymeleaf ─────────────────────────────────────────────────────────
spring.thymeleaf.cache=false
